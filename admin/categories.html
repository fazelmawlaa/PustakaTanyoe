<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kategori Koleksi — Admin PustakaTanyoe USK</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/animations.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand" style="justify-content:space-between;">
      <a href="dashboard.html" style="display:flex; align-items:center; gap:var(--space-3); text-decoration:none;">
        <img src="../assets/images/logo_usk_clean.png" alt="Logo USK" class="sidebar-logo-img" />
        <div class="sidebar-brand-text">
          <div class="site-name">PustakaTanyoe</div>
          <div class="site-sub">Admin Control Center</div>
        </div>
      </a>
      <button type="button" class="sidebar-close-btn" onclick="toggleAdminSidebar()" title="Sembunyikan Menu Sidebar">
        <i class="fas fa-chevron-left"></i>
      </button>
    </div>
      <div class="sidebar-nav">
        <div class="sidebar-section-label">Manajemen Utama</div>
        <a href="dashboard.html" class="sidebar-link"><span class="link-icon"><i
              class="fas fa-tachometer-alt"></i></span><span>Dashboard</span></a>
        <a href="books.html" class="sidebar-link"><span class="link-icon"><i class="fas fa-book"></i></span><span>Kelola
            Buku</span></a>
        <a href="loans.html" class="sidebar-link"><span class="link-icon"><i
              class="fas fa-clipboard-list"></i></span><span>Sirkulasi & Peminjaman</span></a>
        <a href="members.html" class="sidebar-link"><span class="link-icon"><i
              class="fas fa-users"></i></span><span>Kelola Anggota</span></a>
        <div class="sidebar-section-label">Layanan & Keuangan</div>
        <a href="fines.html" class="sidebar-link"><span class="link-icon"><i
              class="fas fa-money-bill-wave"></i></span><span>Kelola Denda</span></a>
        <a href="categories.html" class="sidebar-link active"><span class="link-icon"><i
              class="fas fa-tags"></i></span><span>Kategori Koleksi</span></a>
        <a href="reports.html" class="sidebar-link"><span class="link-icon"><i
              class="fas fa-chart-line"></i></span><span>Laporan & Statistik</span></a>
      </div>
      <div class="sidebar-footer" id="sidebarUser"></div>
    </aside>

    <div class="app-content">
      <header class="app-header">
        <div class="flex items-center gap-3">
          <button class="btn btn-ghost btn-icon sidebar-toggle-btn" onclick="toggleAdminSidebar()" title="Sembunyikan / Tampilkan Menu Sidebar">
          <i class="fas fa-bars"></i>
        </button>
          <h2 class="app-header-title">Klasifikasi & Kategori Bidang Ilmu</h2>
        </div>
        <div class="app-header-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddCategoryModal()"><i class="fas fa-plus"></i> Tambah
            Kategori</button>
        </div>
      </header>

      <main class="app-main">
        <div class="card">
          <div class="card-header">
            <h4 class="card-title" style="font-size: var(--text-base);"><i class="fas fa-folder-open text-gold"></i>
              Master Kategori Buku </h4>
          </div>
          <div class="table-wrapper">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>No</th>
                  <th>Nama Kategori</th>
                  <th>Jumlah Judul Koleksi</th>
                  <th class="text-right">Aksi</th>
                </tr>
              </thead>
              <tbody id="categoryTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Scripts -->
  <script src="../js/patterns/singleton.js"></script>
  <script src="../js/patterns/observer.js"></script>
<script src="../js/patterns/state.js"></script>
<script src="../js/patterns/facade.js"></script>
  <script src="../js/patterns/factory.js"></script>
  <script src="../js/data/books.js"></script>
  <script src="../js/data/users.js"></script>
  <script src="../js/data/loans.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const session = requireAdmin('../login.html');
      if (!session) return;
      renderCategories();
    });

    function renderCategories() {
      const config = LibraryConfig.getInstance();
      const cats = config.get('categories') || [];
      const books = getBooks();

      const tbody = document.getElementById('categoryTableBody');
      tbody.innerHTML = cats.map((cat, idx) => {
        const count = books.filter(b => b.category === cat).length;
        return `
      <tr>
        <td class="font-mono text-xs">${idx + 1}</td>
        <td><span class="font-semibold text-navy">${cat}</span></td>
        <td><span class="badge badge-gold">${count} Judul Buku</span></td>
        <td class="text-right">
          <button class="btn btn-ghost btn-sm text-danger btn-icon" onclick="removeCategory('${cat}')" title="Hapus"><i class="fas fa-trash-alt"></i></button>
        </td>
      </tr>`;
      }).join('');
    }

    function openAddCategoryModal() {
      const newCat = prompt('Masukkan nama kategori baru untuk koleksi USK:');
      if (newCat && newCat.trim()) {
        const config = LibraryConfig.getInstance();
        const cats = config.get('categories') || [];
        if (!cats.includes(newCat.trim())) {
          cats.push(newCat.trim());
          config.set('categories', cats);
          showToast('success', 'Kategori Ditambahkan', `"${newCat.trim()}" telah masuk ke daftar.`);
          renderCategories();
        } else {
          showToast('warning', 'Duplikasi', 'Kategori sudah ada dalam daftar.');
        }
      }
    }

    function removeCategory(cat) {
      if (confirm(`Apakah Anda yakin ingin menghapus kategori "${cat}"?`)) {
        const config = LibraryConfig.getInstance();
        let cats = config.get('categories') || [];
        cats = cats.filter(c => c !== cat);
        config.set('categories', cats);
        showToast('info', 'Dihapus', `Kategori "${cat}" berhasil dihapus.`);
        renderCategories();
      }
    }
  </script>
</body>

</html>
